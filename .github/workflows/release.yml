name: plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish; empty runs validation only
        required: false
        type: string

permissions:
  contents: read

env:
  RAYLEABOT_SDK_REF: sdk/go/v0.7.0
  GO_VERSION: 1.26.6
  NODE_VERSION: 26.7.0
  PNPM_VERSION: 11.22.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Checkout pinned RayleaBot SDK
        uses: actions/checkout@v7
        with:
          repository: RayleaBot/RayleaBot
          ref: ${{ env.RAYLEABOT_SDK_REF }}
          path: .rayleabot/core

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup pnpm
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Link checked-out SDKs
        shell: bash
        run: |
          set -euo pipefail
          cat > go.work <<EOF
          go ${GO_VERSION}

          use (
            .
            ./.rayleabot/core/sdk/go
          )
          EOF
          if [ -f ui/package.json ]; then
            mkdir -p .rayleabot/sdk
            cp -R .rayleabot/core/sdk/vue .rayleabot/sdk/vue
          fi

      - name: Test Go plugin
        run: go test -race ./...

      - name: Test Vue management UI
        if: ${{ hashFiles('ui/package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui typecheck
          pnpm --dir ui test
          pnpm --dir ui build

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, linux-x64, macos-arm64]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Checkout pinned RayleaBot SDK
        uses: actions/checkout@v7
        with:
          repository: RayleaBot/RayleaBot
          ref: ${{ env.RAYLEABOT_SDK_REF }}
          path: .rayleabot/core

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup pnpm
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: ${{ hashFiles('ui/package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Link checked-out SDKs
        shell: bash
        run: |
          set -euo pipefail
          cat > go.work <<EOF
          go ${GO_VERSION}

          use (
            .
            ./.rayleabot/core/sdk/go
          )
          EOF
          if [ -f ui/package.json ]; then
            mkdir -p .rayleabot/sdk
            cp -R .rayleabot/core/sdk/vue .rayleabot/sdk/vue
          fi

      - name: Build plugin artifact
        env:
          RAYLEA_PLUGIN_BUILD_USE_WORKSPACE: '1'
        run: go run github.com/RayleaBot/RayleaBot/sdk/go/cmd/raylea-plugin build-go --plugin . --backend ./cmd/game-guide --target "${{ matrix.target }}" --out dist

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: plugin-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create -R "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" release-assets/*.zip --generate-notes --verify-tag
